version: '3.8'

services:
  promptly:
    image: smkgun/promptly:latest
    container_name: promptly
    ports:
      - "8080:3001"
    volumes:
      - /mnt/cyano/appdata/promptly/data:/app/data
    restart: unless-stopped
    environment:
      - PORT=3001
      - DATA_DIR=/app/data
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
    deploy:
      resources:
        limits:
          memory: 512M
