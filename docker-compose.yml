version: '3.8'

services:
  promptly:
    image: ${DOCKER_IMAGE:-smkgun/promptly:latest}
    container_name: promptly
    ports:
      - "8080:3001"
    volumes:
      - promptly-data:/app/data
    restart: unless-stopped
    environment:
      - PORT=3001
      - DATA_DIR=/app/data
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  promptly-data:
    driver: local
